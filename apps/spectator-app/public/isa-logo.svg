<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="isaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" stroke="url(#isaGradient)" stroke-width="3" fill="none" opacity="0.3"/>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="88" fill="url(#isaGradient)" filter="url(#glow)"/>
  
  <!-- Inner accent ring -->
  <circle cx="100" cy="100" r="78" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.2"/>
  
  <!-- ISA Text -->
  <text x="100" y="118" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-2">
    ISA
  </text>
  
  <!-- Tech subtitle -->
  <text x="100" y="142" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="white" opacity="0.85" letter-spacing="4">
    TECH
  </text>
  
  <!-- Running figure silhouette -->
  <g transform="translate(100, 100) scale(0.35)">
    <path d="M0 -40 Q-8 -20 -15 0 Q-10 20 0 30 Q10 20 15 0 Q8 -20 0 -40" fill="white" opacity="0.9"/>
    <ellipse cx="0" cy="-55" rx="12" ry="10" fill="white" opacity="0.9"/>
    <!-- Motion lines -->
    <g stroke="white" stroke-width="2" opacity="0.6">
      <line x1="-35" y1="10" x2="-50" y2="20"/>
      <line x1="-35" y1="20" x2="-52" y2="30"/>
      <line x1="-35" y1="30" x2="-48" y2="42"/>
    </g>
  </g>
</svg>