<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="marathonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- ISA Logo Mark -->
  <g transform="translate(20, 10)">
    <circle cx="30" cy="30" r="28" fill="url(#logoGradient)" filter="url(#textGlow)"/>
    <text x="30" y="39" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="white" letter-spacing="-0.5">ISA</text>
    <text x="30" y="50" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4.5" font-weight="600" fill="white" opacity="0.9" letter-spacing="1.5">TECH</text>
  </g>
  
  <!-- Divider -->
  <line x1="85" y1="18" x2="85" y2="62" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Marathon Text -->
  <g transform="translate(105, 0)">
    <text x="0" y="35" text-anchor="start" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#marathonGradient)" filter="url(#textGlow)" letter-spacing="0.5">MARATHON</text>
    <text x="0" y="55" text-anchor="start" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="3">2026 EDITION</text>
  </g>
  
  <!-- Accent line -->
  <line x1="105" y1="62" x2="240" y2="62" stroke="url(#marathonGradient)" stroke-width="2" opacity="0.6"/>
</svg>