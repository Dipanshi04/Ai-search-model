<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="marathonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="marathonGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="marathonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="96" stroke="url(#marathonGradient)" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Main background circle -->
  <circle cx="100" cy="100" r="90" fill="#0f172a" filter="url(#shadow)"/>
  
  <!-- Inner gradient ring -->
  <circle cx="100" cy="100" r="84" stroke="url(#marathonGradient)" stroke-width="2.5" fill="none"/>
  
  <!-- Laurel wreath left -->
  <path d="M45 65 Q35 55 30 70 Q25 85 40 95 Q55 105 65 95 Q70 80 60 65 Q50 55 45 65" 
        stroke="url(#marathonGradient)" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M45 65 Q40 58 38 70 Q35 82 45 92 Q55 100 62 90 Q65 80 58 68 Q52 60 45 65" 
        stroke="url(#marathonGradient)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Laurel wreath right -->
  <path d="M155 65 Q165 55 170 70 Q175 85 160 95 Q145 105 135 95 Q130 80 140 65 Q150 55 155 65" 
        stroke="url(#marathonGradient)" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M155 65 Q160 58 162 70 Q165 82 155 92 Q145 100 138 90 Q135 80 142 68 Q148 60 155 65" 
        stroke="url(#marathonGradient)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Top ribbon/banner -->
  <ellipse cx="100" cy="48" rx="55" ry="18" fill="url(#marathonGradient)" filter="url(#marathonGlow)"/>
  <text x="100" y="54" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="white" letter-spacing="3">
    MARATHON
  </text>
  
  <!-- Central running figure -->
  <g transform="translate(100, 110) scale(0.55)" filter="url(#marathonGlow)">
    <!-- Body -->
    <path d="M0 -35 Q-6 -18 -12 0 Q-8 18 0 28 Q8 18 12 0 Q6 -18 0 -35" fill="url(#marathonGradientAlt)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-48" rx="10" ry="11" fill="url(#marathonGradientAlt)"/>
    <!-- Arms -->
    <path d="M-12 -10 Q-25 -15 -32 5 Q-35 15 -30 22" stroke="url(#marathonGradientAlt)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M12 -10 Q25 -15 32 5 Q35 15 30 22" stroke="url(#marathonGradientAlt)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M-4 28 Q-10 45 -5 65 Q0 75 4 68" stroke="url(#marathonGradientAlt)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M4 28 Q12 40 18 60 Q20 72 14 68" stroke="url(#marathonGradientAlt)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Motion lines -->
    <g stroke="#10b981" stroke-width="2.5" opacity="0.8">
      <line x1="-38" y1="8" x2="-52" y2="18"/>
      <line x1="-38" y1="18" x2="-55" y2="28"/>
      <line x1="-38" y1="28" x2="-50" y2="40"/>
      <line x1="38" y1="8" x2="52" y2="18"/>
      <line x1="38" y1="18" x2="55" y2="28"/>
      <line x1="38" y1="28" x2="50" y2="40"/>
    </g>
  </g>
  
  <!-- Year badge -->
  <ellipse cx="100" cy="165" rx="35" ry="16" fill="#0f172a" stroke="url(#marathonGradient)" stroke-width="2"/>
  <text x="100" y="170" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="url(#marathonGradient)" letter-spacing="1">
    2026
  </text>
  
  <!-- Small decorative elements -->
  <g fill="url(#marathonGradient)" opacity="0.7">
    <circle cx="100" cy="28" r="3"/>
    <circle cx="100" cy="172" r="3"/>
    <circle cx="28" cy="100" r="3"/>
    <circle cx="172" cy="100" r="3"/>
  </g>
</svg>