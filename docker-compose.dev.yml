# Development Docker Compose - Only PostgreSQL and Redis
# Frontend and backend run directly with PNPM (faster HMR)

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: isa-postgres
    environment:
      POSTGRES_DB: isa_marathon
      POSTGRES_USER: isa
      POSTGRES_PASSWORD: isa_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isa -d isa_marathon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: isa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
