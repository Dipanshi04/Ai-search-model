events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:4000;
    }

    upstream static_public {
        server localhost:3000;
    }

    upstream static_runner {
        server localhost:3001;
    }

    upstream static_spectator {
        server localhost:3002;
    }

    upstream static_admin {
        server localhost:3003;
    }

    upstream static_led {
        server localhost:3004;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name marathon.theisa.in admin.theisa.in;
        return 301 https://$host$request_uri;
    }

    # Main domain - marathon.theisa.in
    server {
        listen 443 ssl http2;
        server_name marathon.theisa.in;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api;
        }

        location /socket.io/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /certificates/ {
            proxy_pass http://api;
        }

        # Runner app
        location /runner {
            proxy_pass http://static_runner;
            proxy_set_header Host $host;
        }

        location /runner/ {
            proxy_pass http://static_runner;
            proxy_set_header Host $host;
        }

        # Spectator app
        location /spectator {
            proxy_pass http://static_spectator;
            proxy_set_header Host $host;
        }

        location /spectator/ {
            proxy_pass http://static_spectator;
            proxy_set_header Host $host;
        }

        # LED dashboard
        location /led-dashboard {
            proxy_pass http://static_led;
            proxy_set_header Host $host;
        }

        location /led-dashboard/ {
            proxy_pass http://static_led;
            proxy_set_header Host $host;
        }

        # Public website (catch-all, must be last)
        location / {
            proxy_pass http://static_public;
            proxy_set_header Host $host;
        }
    }

    # Admin domain - admin.theisa.in
    server {
        listen 443 ssl http2;
        server_name admin.theisa.in;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://static_admin;
        }

        location /api/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
