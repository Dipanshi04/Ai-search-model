events {
    worker_connections 1024;
}

http {
    upstream api {
         server 127.0.0.1:4000;
    }

    # nginx defaults to 1MB, which silently rejects any real phone photo
    # upload before it reaches the API's own 10MB multer limit.
    client_max_body_size 10m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/javascript text/css;
    gzip_min_length 1024;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name marathon.theisa.in admin.theisa.in;
        return 301 https://$host$request_uri;
    }

    # Main domain - marathon.theisa.in
    server {
        listen 443 ssl http2;
        server_name marathon.theisa.in;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;

        root /var/www/isa-marathon/public;

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api;
        }

        location /socket.io/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /certificates/ {
            proxy_pass http://api;
        }

        location /uploads/ {
            proxy_pass http://api;
        }

        # Runner app - serve static files
        location /runner/ {
            alias /var/www/isa-marathon/runner/;
            try_files $uri $uri/ /runner/index.html;
        }

        # Spectator app - serve static files
        location /spectator/ {
            alias /var/www/isa-marathon/spectator/;
            try_files $uri $uri/ /spectator/index.html;
        }

        # LED dashboard - serve static files
        location /led-dashboard/ {
            alias /var/www/isa-marathon/led/;
            try_files $uri $uri/ /led-dashboard/index.html;
        }

        # Public website - serve static files (catch-all, must be last)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Admin domain - admin.theisa.in
    server {
        listen 443 ssl http2;
        server_name admin.theisa.in;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000" always;

        root /var/www/isa-marathon/admin;

        location /api/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
